services:
  db:
    image: postgres:16-alpine
    container_name: majorbot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: majorbot
      POSTGRES_USER: majorbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majorbot -d majorbot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: majors-lair-bot:local
    container_name: majorbot-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://majorbot:${POSTGRES_PASSWORD}@db:5432/majorbot
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: majorbot-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  caddy_data:
  caddy_config:
